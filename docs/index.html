<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نجومي</title>
<meta name="theme-color" content="#7CC8F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="نجومي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app.css?v=1">
<link rel="stylesheet" href="extra.css?v=1">
<script src="config.js?v=1"></script>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="app" id="app" dir="rtl" lang="ar">
  <header class="bar glass">
    <div class="brand"><span class="logo" id="logo"></span><h1 data-i18n="brand">نجومي</h1></div>
    <div class="ctrls">
      <div class="seg" role="group" id="roles" hidden>
        <button id="roleKid" aria-pressed="false" data-i18n="roleKid">واجهة الطفل</button>
        <button id="roleParent" aria-pressed="true" data-i18n="roleParent">واجهة الوالدين</button>
      </div>
      <div class="pal" id="pal">
        <button id="palBtn" aria-haspopup="listbox" aria-expanded="false"><span class="sw" id="palSw"></span><span id="palName"></span><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="palMenu glass" id="palMenu" role="listbox" hidden>
          <button role="option" data-pal="royal" style="--c1:#1F4FE0;--c2:#FFC400"><span class="sw"></span><span data-i18n="p_royal"></span><small data-i18n="p_royal_d"></small></button>
          <button role="option" data-pal="web" style="--c1:#D7263D;--c2:#2F6BFF"><span class="sw"></span><span data-i18n="p_web"></span><small data-i18n="p_web_d"></small></button>
          <button role="option" data-pal="sea" style="--c1:#0089B5;--c2:#FFD400"><span class="sw"></span><span data-i18n="p_sea"></span><small data-i18n="p_sea_d"></small></button>
          <button role="option" data-pal="speed" style="--c1:#1446E0;--c2:#3DBE4A"><span class="sw"></span><span data-i18n="p_speed"></span><small data-i18n="p_speed_d"></small></button>
          <button role="option" data-pal="blocks" style="--c1:#6D28D9;--c2:#5DBB3F"><span class="sw"></span><span data-i18n="p_blocks"></span><small data-i18n="p_blocks_d"></small></button>
        </div>
      </div>
      <button class="mode lang" id="lang"></button>
      <button class="mode" id="mode"></button>
    </div>
  </header>
  <main id="view" class="app" style="width:100%"></main>
  <p class="note install glass" id="install" hidden></p>
</div>
<script type="module" src="app.js?v=1"></script>
</body>
</html>
